      <stop offset="0" stop-color="#ffef9a" stop-opacity="0.15"/>
      <stop offset="0.42" stop-color="#7ef5ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff7f9b" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="52%">
