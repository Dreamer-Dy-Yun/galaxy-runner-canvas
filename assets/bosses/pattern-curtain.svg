<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Boss curtain fire pattern">
  <defs>
    <linearGradient id="beam" x1="0" y1="8" x2="0" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#ffef9a"/>
      <stop offset="1" stop-color="#ff617f" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#090f20" opacity="0.5"/>
  <g filter="url(#glow)" stroke="url(#beam)" stroke-width="4.4" stroke-linecap="round">
    <path d="M14 12 V52"/>
    <path d="M23 9 V55"/>
    <path d="M32 12 V52"/>
    <path d="M41 9 V55"/>
    <path d="M50 12 V52"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="14" cy="18" r="2.4"/>
    <circle cx="32" cy="26" r="2.4"/>
    <circle cx="50" cy="18" r="2.4"/>
  </g>
</svg>
