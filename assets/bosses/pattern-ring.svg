<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Boss radial ring pattern">
  <defs>
    <radialGradient id="pulse" cx="50%" cy="50%" r="48%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#8ffbff"/>
      <stop offset="1" stop-color="#ff617f" stop-opacity="0.12"/>
    </radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#071420" opacity="0.5"/>
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="21" fill="none" stroke="#7ef5ff" stroke-width="3" opacity="0.88"/>
    <circle cx="32" cy="32" r="9" fill="url(#pulse)"/>
    <g fill="#ffef9a">
      <circle cx="32" cy="7" r="2.7"/>
      <circle cx="45" cy="10.4" r="2.7"/>
      <circle cx="54.6" cy="20" r="2.7"/>
      <circle cx="58" cy="32" r="2.7"/>
      <circle cx="54.6" cy="44" r="2.7"/>
      <circle cx="45" cy="53.6" r="2.7"/>
      <circle cx="32" cy="57" r="2.7"/>
      <circle cx="19" cy="53.6" r="2.7"/>
      <circle cx="9.4" cy="44" r="2.7"/>
      <circle cx="6" cy="32" r="2.7"/>
      <circle cx="9.4" cy="20" r="2.7"/>
      <circle cx="19" cy="10.4" r="2.7"/>
    </g>
  </g>
</svg>
