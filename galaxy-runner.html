  <body>
    <main class="app">
      <div class="topbar">
        <div>
          <h1>Galaxy Runner</h1>
        </div>
        <p id="game-controls" class="hint">방향키/WASD 이동 · Space 발사 · X/Ctrl 특수기 · P/Esc 일시정지 · I 정보 · R 처음부터</p>
        <button id="audio-toggle" type="button" aria-label="게임 소리 끄기" aria-pressed="false">소리 켬</button>
        <button id="restart" type="button">처음부터</button>
      </div>
      <div class="stage">
        <canvas
          id="game"
          width="960"
          height="540"
          tabindex="0"
          aria-label="Galaxy Runner 슈팅 게임 화면"
          aria-describedby="game-controls"
        >
          Galaxy Runner는 키보드로 조작하는 Canvas 슈팅 게임입니다. 방향키 또는 WASD로 이동하고 Space로 발사합니다.
        </canvas>
      </div>
      <div id="game-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>
  </body>
